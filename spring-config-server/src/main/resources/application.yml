server:
  port: 8888

spring:
  application:
    name: spring-config-server
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/theashish-1/cloud-config-restaurent-app.git"
          default-label: main #defines in which branch to fetch the configuration 
          timeout: 5  #maximum it should take 5 seconds to set up the get , clone the  repo and paste it in the local system
          clone-on-start: true #cloning the repo is done in the intial stage only 
          force-pull : true # pull the latest local copy fro the repository  

#Eureka configuration 
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

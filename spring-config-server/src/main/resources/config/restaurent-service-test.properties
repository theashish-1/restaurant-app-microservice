# ===================================================================
# TEST / QA ENVIRONMENT CONFIGURATION
# ===================================================================
server.port=9082

# Test Database Settings
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/restaurant_db_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Test Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# App Info
info.app.name=Restaurant Service - Test
info.app.description=Restaurant service running in test environment
info.app.version=1.0.0

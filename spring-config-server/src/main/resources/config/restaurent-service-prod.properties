# ===================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ===================================================================
server.port=9091

# Production Database Settings
spring.datasource.url=${PROD_DB_URL:jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${PROD_DB_USERNAME:root}
spring.datasource.password=${PROD_DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA Production Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# App Info
info.app.name=Restaurant Service - Production
info.app.description=Restaurant service running in production environment
info.app.version=1.0.0

# ===================================================================
# APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=restaurent-service
server.port=9091

# ===================================================================
# MYSQL DATABASE CONNECTION SETTINGS
# ===================================================================
# Note: Database credentials use environment variables with local defaults.
# Format: ${ENVIRONMENT_VARIABLE_NAME:default_fallback_value}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATIONS
# ===================================================================
# Automatically updates the database schema based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Logging configurations for development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#configure eureka client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# ===================================================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ===================================================================
server.port=9081

# Development Database Settings
spring.datasource.url=${DEV_DB_URL:jdbc:mysql://localhost:3306/restaurant_db_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DEV_DB_USERNAME:root}
spring.datasource.password=${DEV_DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Development Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# App Info
info.app.name=Restaurant Service - Development
info.app.description=Restaurant service running in dev environment
info.app.version=1.0.0
